name: PPE research
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"
jobs:
  study:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/download_binance.py --days 90
      - run: python scripts/run_study.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-ppe-results
          path: artifacts/
